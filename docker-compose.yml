services:
  # Laravel + Inertia monolith (PHP-FPM + Nginx)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./.env:/var/www/html/.env:ro
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cms-net

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-scholargate}
      POSTGRES_USER: ${DB_USERNAME:-scholargate}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-scholargate}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cms-net

networks:
  cms-net:
    driver: bridge

volumes:
  app_storage:
  app_cache:
  db_data:
