services:
  # ─────────────────────────────────────────────────────────────
  # Frontend: React SPA dilayani Nginx (→ smage.my.id via reverse proxy)
  # ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://api-cms.smage.my.id
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - cms-net

  # ─────────────────────────────────────────────────────────────
  # Backend: Laravel API dilayani PHP-FPM + Nginx (→ api-cms.smage.my.id)
  # ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend/.env:/var/www/html/.env:ro
      - backend_storage:/var/www/html/storage
      - backend_cache:/var/www/html/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cms-net

  # ─────────────────────────────────────────────────────────────
  # Database: PostgreSQL
  # (Skip ini jika sudah pakai PostgreSQL dari aaPanel)
  # ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-scholargate}
      POSTGRES_USER: ${DB_USERNAME:-scholargate}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-scholargate}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cms-net

networks:
  cms-net:
    driver: bridge

volumes:
  backend_storage:
  backend_cache:
  db_data:
